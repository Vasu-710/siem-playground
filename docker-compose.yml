services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem_pass
      POSTGRES_DB: siemdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d siemdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  collector:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://siem:siem_pass@db:5432/siemdb
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build:
      context: .
      dockerfile: infra/Dockerfile.pipeline
    environment:
      DATABASE_URL: postgresql://siem:siem_pass@db:5432/siemdb
      WINDOW_SECONDS: "300"
      DEDUP_SECONDS: "300"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: infra/Dockerfile.ui
    ports: ["3000:3000"]
    environment:
      REACT_APP_API_URL: http://localhost:8000
    depends_on:
      - collector

volumes:
  pgdata:
