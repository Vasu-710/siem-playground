name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # The database tests run against a real Postgres, because the thing being
    # tested is the SQL. Mocking it would only test the mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siem
          POSTGRES_PASSWORD: siem_pass
          POSTGRES_DB: siemdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U siem -d siemdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://siem:siem_pass@localhost:5432/siemdb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: coverage run --source=siemlib,pipeline,collectors -m pytest tests/ -v

      - name: Coverage report
        run: |
          coverage report -m
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A failed upload is a problem with Codecov, not with the code. It
          # should not turn the build red and claim the tests broke.
          fail_ci_if_error: false